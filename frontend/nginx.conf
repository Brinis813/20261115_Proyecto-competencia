# El frontend hace de unica puerta de entrada: sirve la aplicacion y
# redirige /api y /socket.io al backend. Al compartir origen, la cookie de
# sesion viaja sin configuracion de CORS ni de SameSite entre dominios.

# M7: Upstream con keepalive para reutilizar conexiones TCP al backend.
upstream backend_upstream {
    server backend:3001;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La IP real llega desde Traefik/Dokploy; se propaga al backend para que
    # el limitador de peticiones no vea a todos los clientes como uno solo.
    real_ip_header X-Forwarded-For;

    # Cabeceras de seguridad (HSTS, CSP, anti-clickjacking, etc.).
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # M6: Habilitar compresión para respuestas de proxy (API JSON).
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml text/xml;

    client_max_body_size 8m;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # M7: Habilitar keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket ----------
    # Necesita HTTP/1.1 y las cabeceras de Upgrade; sin esto la clasificacion
    # en vivo cae a long-polling o directamente no conecta.
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una conexion en vivo puede pasar minutos sin trafico entre resultados.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Estaticos ----------
    # Vite pone un hash en el nombre de cada archivo, asi que se pueden cachear
    # para siempre sin riesgo de servir una version antigua.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header propio: hay que reincluir las cabeceras de seguridad.
        include /etc/nginx/security-headers.conf;
    }

    # index.html y el service worker nunca se cachean: son los que anuncian
    # que hay una version nueva.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # ---------- SPA ----------
    # Cualquier ruta desconocida devuelve index.html para que el router del
    # navegador resuelva enlaces profundos como /leaderboard/3. Sin caché:
    # es la puerta de entrada y debe revalidar siempre (un proxy intermedio
    # no debe servir una versión antigua).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
