# Cabeceras de seguridad, en un unico sitio.
#
# Se incluye tanto a nivel de servidor como dentro de cada `location` que define
# sus propios `add_header`: en nginx, un bloque con add_header propio DESCARTA
# los heredados, asi que hay que reincluirlas o esos recursos quedarian sin
# proteccion.

# HTTPS obligatorio: una vez servido por HTTPS, el navegador no vuelve a intentar
# HTTP durante dos anios. El proxy de Dokploy/Traefik termina el TLS por delante.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# No se puede enmarcar la app (clickjacking) ni interpretar tipos MIME a la fuerza.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;

# Solo se envia el origen como referer al salir del sitio.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Se niegan APIs sensibles del navegador que la app no usa.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Aisla la ventana de otros contextos (Spectre / cross-origin).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy: todo desde el propio origen. Se permiten solo las
# fuentes de Google (CSS + tipografias) que carga index.html y estilos en linea
# que inyecta React/Tailwind. connect-src incluye Google Fonts porque el service
# worker cachea la hoja de fuentes con fetch(): sin esto la consola muestra
# "Refused to connect ... violates connect-src 'self'". Sin scripts ni otras
# conexiones a terceros: el /api y el websocket viajan por el mismo origen.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;
