# Competition Manager - despliegue completo (base de datos + API + frontend)
#
# Los valores salen del archivo .env que hay junto a este fichero. En Dokploy
# se definen en la pestana Environment del proyecto.
#
# El unico servicio expuesto al exterior es `frontend`: sirve la aplicacion y
# redirige /api y /socket.io al backend por la red interna. El backend y MySQL
# no publican puertos, asi que no son accesibles desde Internet.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Endurecido como el resto: rootfs de solo lectura (el datadir es volumen
    # escribible; /tmp y el socket van a tmpfs) y sin capacidades salvo las
    # mínimas que exige mysqld.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hyrox_db}
      MYSQL_USER: ${MYSQL_USER:-hyrox_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD en .env}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Password explícito (no solo MYSQL_PWD implícito): evita falsos
      # unhealthy tras upgrades de la imagen 8.0.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks: [interna]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G, pids: 200 }
        reservations: { cpus: '0.25', memory: 512M }

  mysql-backup:
    image: mysql:8.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_backups:/backups
    entrypoint: >
      sh -c '
        while true; do
          echo "[$(date)] Starting backup...";
          mysqldump -h mysql -u root --single-transaction --routines --triggers "$${MYSQL_DATABASE:-hyrox_db}" | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
          echo "[$(date)] Backup complete. Cleaning old backups (>7d)...";
          find /backups -name "backup_*.sql.gz" -mtime +7 -delete 2>/dev/null || true;
          echo "[$(date)] Sleeping 24h...";
          sleep 86400;
        done
      '
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD-SHELL', 'command -v mysqldump >/dev/null 2>&1 && kill -0 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks: [interna]
    deploy:
      resources:
        limits: { cpus: '0.1', memory: 128M, pids: 50 }

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 35s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3001}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hyrox_db}
      DB_USER: ${MYSQL_USER:-hyrox_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (minimo 32 caracteres)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-4h}
      CORS_ORIGIN: ${CORS_ORIGIN:?define CORS_ORIGIN en .env}
      # Frontend (nginx) + proxy de Dokploy delante del backend.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      SEED_ADMIN_CEDULA: ${SEED_ADMIN_CEDULA:-0000000000}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?define SEED_ADMIN_PASSWORD en .env}
      SEED_DEMO: ${SEED_DEMO:-false}
    security_opt: [no-new-privileges:true]
    # H9: Healthcheck real — verifica que la API responde, no solo que el proceso corre.
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:${BACKEND_PORT:-3001}/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Las portadas de los eventos sobreviven a redespliegues.
      - backend_uploads:/app/uploads
    networks: [interna]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    deploy:
      resources:
        # M11: Aumentado a 768M para soportar cálculos de leaderboard con competencias grandes.
        limits: { cpus: '0.5', memory: 768M, pids: 200 }
        reservations: { cpus: '0.25', memory: 512M }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # read_only desactivado a propósito (auditoría 2026-09): nginx como USER nginx
    # necesita escribir fuera de los tmpfs declarados (mkdir client_temp Permission
    # denied al activarlo). Se mantiene cap_drop + no-new-privileges. Reevaluar
    # solo probando `docker compose up` con read_only: true.
    #read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      # Unico puerto publicado. En Dokploy se deja que su proxy lo tome y le
      # ponga el dominio y el certificado HTTPS.
      - '${FRONTEND_PORT:-80}:8080'
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks: [interna]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M, pids: 100 }
        reservations: { cpus: '0.1', memory: 64M }

volumes:
  mysql_data:
    driver: local
  mysql_backups:
    driver: local
  backend_uploads:
    driver: local

networks:
  interna:
    driver: bridge
